services:
  db:
    image: postgres:15
    container_name: scorefrost-db
    env_file: .env
    ports:
      - "${PGPORT}:${PGPORT}"
    volumes:
      - scorefrost-data:/var/lib/postgresql/data

  api:
    container_name: scorefrost-api
    build: .
    env_file: .env
    environment:
      - PGHOST=db
      - DOCKER_ENV=true
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      - db

volumes:
  scorefrost-data:
